# Gate decision records — docs/adr/ and docs/debt/ — on every PR.
#
# Copy this file to .github/workflows/records.yml; check-records.sh, check-records-test.sh and
# migrate-records.sh beside it to .github/scripts/; and both profiles/*.sh beside them to
# .github/scripts/profiles/. Six files, including the migrator even though it never runs here:
# the suite the first step runs resolves it beside itself and stops with
# an incomplete-install error if it is missing. The `tome-of-lore` skill does that for you;
# nothing here depends on the skill afterwards, so an adopting repo owns its copy outright.
#
# chmod +x only the three scripts. The profiles are sourced, carry no shebang, and stay 0644 —
# the execute bit would trip check-executables-have-shebangs without changing behavior.
#
# $trial-loop may resolve a valid finding as `deferred-tracked` instead of fixing it,
# which is legitimate — the record is what makes it honest. This job checks the records
# rather than the deferrals: a malformed record, or a record that stopped being a record,
# fails the PR. The existence of a deferral never does.
#
# The gate is advisory until this job is a **required status check** in branch protection:
# a PR may edit the checker, and a PR that deletes this file stops the job rather than
# failing it. The checker detects deletion of its own files; nothing detects an edit.
#
# Needs no secrets, no third-party actions, and no write permissions, so it also runs on
# fork PRs. fetch-depth: 0 and the explicit base SHA are what let the checker read the
# record set as it stood at the PR's base commit; a shallow checkout leaves that commit
# unreachable, which is a hard failure rather than a skipped check.
name: records

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: records-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checker's own suite runs first: its dangerous failure mode is reporting a
      # clean run over nothing, so a broken checker must not be the thing that declares
      # the records fine.
      - name: Test the checker
        run: ./.github/scripts/check-records-test.sh "${RUNNER_TEMP}/check-records-test"

      - name: Check decision records
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RECORD_PROFILES: adr debt
          # Set ADR_INDEX_POLICY: required when separate required CI enforces a
          # hand-maintained ADR index. The default directory policy warns on such a table.
        run: ./.github/scripts/check-records.sh
