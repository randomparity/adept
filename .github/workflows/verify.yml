name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    # macOS is not redundant coverage. Its system bash is 3.2 and its sed is BSD,
    # and both have already shipped breakage this suite could not see from ubuntu
    # alone: a `mapfile` that exits 127 and a `sed -i` that reads the script as a
    # backup suffix. Neither reproduces on GNU userland.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Homebrew ships on both runner images and carries a bottle for every tool
      # the gates need, so one command covers both legs. The shellenv line is for
      # ubuntu, where Homebrew lives under /home/linuxbrew and is not guaranteed
      # to be on PATH; on macOS the guard is false and brew is already there.
      - name: Install tools
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            printf '%s\n' "$HOMEBREW_PREFIX/bin" >>"$GITHUB_PATH"
          fi
          brew install --quiet just shfmt actionlint zizmor prek ripgrep shellcheck jq zsh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # `just plugin-check` runs the harness's own validator against the
      # manifests, so the harness has to be present. It is the only gate that
      # needs a Claude CLI, and it reads files rather than calling the API.
      #
      # zizmor's adhoc-packages audit wants installs to come from a lockfile.
      # There is no lockfile for a global CLI, and the gate's job is to validate
      # the manifests against the harness people actually run, which is the
      # current one — a pinned CLI here would validate against a harness nobody
      # has. The fallback below keeps that property: it installs the newest
      # release this runner can install, never a version chosen in advance.
      # The suppression sits on the step rather than beside each `npm install`:
      # inside a block scalar a `#` is shell text, not a YAML comment, so zizmor
      # never sees an ignore written there.
      - name: Install Claude Code CLI # zizmor: ignore[adhoc-packages]
        run: |
          # npm skips an optional dependency it cannot resolve rather than
          # failing, so a partial upstream publish — the wrapper at `latest`
          # with no matching platform package for this runner — installs
          # cleanly and leaves no binary behind. Measured 2026-08-20: wrapper
          # 2.1.237 published while @anthropic-ai/claude-code-linux-x64 stopped
          # at 2.1.236, so `npm install -g` reported "added 1 package" and every
          # ubuntu leg then failed in `just plugin-check`, four gates away from
          # the step that actually broke.
          npm install -g @anthropic-ai/claude-code
          if claude --version; then
            exit 0
          fi
          # The wrapper pins its optional dependencies to its own version, so the
          # newest published platform package names the newest wrapper whose
          # binary exists for this runner. Only the platforms this matrix runs on
          # are mapped: a new runner OS or architecture stops here rather than
          # guessing a package name that would 404 into the same silent skip.
          case "$(uname -s)" in
          Linux) os=linux ;;
          Darwin) os=darwin ;;
          *)
            printf 'no platform package mapped for OS %s\n' "$(uname -s)" >&2
            exit 1
            ;;
          esac
          case "$(uname -m)" in
          x86_64) arch=x64 ;;
          arm64 | aarch64) arch=arm64 ;;
          *)
            printf 'no platform package mapped for architecture %s\n' "$(uname -m)" >&2
            exit 1
            ;;
          esac
          version=$(npm view "@anthropic-ai/claude-code-$os-$arch" version)
          printf 'latest carries no %s-%s binary; falling back to %s\n' "$os" "$arch" "$version"
          npm install -g "@anthropic-ai/claude-code@$version"
          # Re-checked rather than assumed. A fallback that resolved to the
          # version already installed leaves npm's tree satisfied and the binary
          # still missing, which is a different fault wearing the same symptom.
          claude --version
      # GH_TOKEN is what puts `just actions-check` into zizmor's online mode, so
      # the pin-provenance audits -- impostor-commit, ref-confusion,
      # known-vulnerable-actions, stale-action-refs, ref-version-mismatch -- run
      # here rather than nowhere. CI is where connectivity is assured and where
      # the required check lives.
      #
      # `permissions:` above is deliberately NOT widened for this and stays
      # `contents: read`: those audits resolve other repositories' refs and the
      # advisory database, neither of which is a resource of this repository.
      # What the line changes is that the token's value is visible to the whole
      # `just ci` step; on a fork pull request GitHub makes it read-only, so the
      # worst it grants is authenticated read of a public repository. Checkout's
      # `persist-credentials: false` is likewise untouched -- that governs a
      # credential in .git/config, and zizmor reads the environment. See ADR 0036.
      - name: Verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        # The guard asserts the one precondition CI's whole provenance coverage
        # rests on. A workstation is offline by default and says so, so this
        # runner is the only place the five online audits execute; if
        # `github.token` ever resolves empty -- a repository or organization
        # setting, a platform change, or this line lost in a conflict resolution
        # -- run-zizmor.sh would report the offline condition and exit 0, and the
        # required check would stay green with no provenance audited anywhere.
        # That is the defect this change removes, relocated one level up, so it
        # gets a red rather than a log line nobody reads. It re-types no gate
        # command; `just ci` is still the recipe.
        run: |
          if [ -z "$GH_TOKEN" ]; then
            printf 'verify: github.token resolved empty; the zizmor online audits would not run\n' >&2
            exit 1
          fi
          just ci

  # A matrix renames its checks to `job (axis)`, so the bare `verify` context that
  # branch protection requires would stop reporting and every PR would sit BLOCKED
  # on a check that never arrives. This job keeps that context stable, so adding or
  # dropping an OS above stays a workflow change and never a repo-settings change.
  #
  # `if: always()` is what makes it a gate rather than a rubber stamp: without it a
  # failed or cancelled matrix skips this job, and a skipped required check reads as
  # success to branch protection. The result is then asserted explicitly.
  verify:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          if [ "$SUITE_RESULT" != success ]; then
            printf 'verify: suite matrix reported %s\n' "$SUITE_RESULT" >&2
            exit 1
          fi
          printf 'verify: every suite leg passed\n'
